<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
  <link rel="stylesheet" href="main.css">
  <title>Dorka Fulop profil card</title>
</head>
<body>
  <div id="card-body">
    <div id="profile-card">
      profile-card
      <div id="head">
        head
        <div id="profile-image">
          <img id=photo src="assets/TamasFulop.png" alt="Dorka Fulop">
        </div>
        <div id="name-headline">
          <h1 id="name">name</h1>
          <h2 id="profession">profession</h2>
          <i class="fa-solid fa-location-dot"></i><span id="address">address</span>
        </div>
      </div>
      <div id="content">
        content
        <p id="about">about</p>
        <section id="links">
          <h2 id="contact">contact</h2>
          <ul>
            <li id="github">github</li>
            <li id="linkedin">linkedin</li>
            <li id="email">email</li>
            <li id="mobile">mobile</li>
          </ul>
        </section>
        <div id="languages">
          <ul>
            <li><button onclick="languageChangeHU()"><img src="assets/Hun48.png" alt="Hun"></button></li>
            <li><button onclick="languageChangeEN()"><img src="assets/UK48.png" alt="UK"></button></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <script src="name.js"></script>
</body>
</html>
